<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let language = ''
        try {
          const saved = window.localStorage.getItem('lycoris.language.v1')
          if (saved === 'zh' || saved === 'en') language = saved
        } catch {
          // The browser language below remains available when storage is blocked.
        }
        if (!language) language = window.navigator.language.toLowerCase().startsWith('zh') ? 'zh' : 'en'
        document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en'
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/LycorisIcon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lycoris</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
